<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>你有一个红包待领取</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior-x:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body{background:#fff;min-height:100vh;font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden}
#guide{display:none;align-items:center;justify-content:center;min-height:100vh;background:#fff;padding:20px}
#guide .card{text-align:center;max-width:360px}
#guide .icon{font-size:48px;margin-bottom:16px}
#guide h2{font-size:20px;color:#333;margin-bottom:12px}
#guide p{font-size:14px;color:#666;line-height:1.6;margin-bottom:20px}
#guide .steps{background:#f8f8f8;border-radius:12px;padding:16px;text-align:left;margin-bottom:20px}
#guide .steps div{font-size:14px;color:#333;padding:6px 0}
#guide .steps span{color:#ff4444;font-weight:bold}
#guide .btn{display:block;width:100%;padding:14px;background:#ff4444;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;touch-action:manipulation}
#guide .btn:active{background:#cc0000}
#guide .hint{font-size:12px;color:#999;margin-top:12px}
.bait{display:none;text-align:center;color:#fff;position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#ff4444 0%,#cc0000 100%);align-items:center;justify-content:center;flex-direction:column;z-index:10;cursor:pointer}
.bait .icon{font-size:80px}
.bait h1{font-size:28px;margin:16px 0 8px}
.bait p{font-size:16px;opacity:.8}
.bait .tap{margin-top:24px;padding:12px 32px;background:#ffd700;color:#c00;border-radius:24px;font-size:18px;font-weight:bold;display:inline-block;animation:bounce 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bait .icon,.bait h1,.bait p{animation:pulse 1.5s infinite}
#player{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999}
#player video{width:100%;height:100%;object-fit:contain}
#pg{position:fixed;bottom:0;left:0;height:4px;background:#f44;z-index:100000}
#shield{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99998;background:transparent;touch-action:none}
</style>
</head>
<body>
<div id="guide">
<div class="card">
<div class="icon">🔗</div>
<h2>请在浏览器中打开</h2>
<p>当前是应用内浏览器，无法正常领取红包。<br>请复制链接后在浏览器中打开：</p>
<div class="steps">
<div>1. 点击下方按钮复制链接</div>
<div>2. 打开 <span>Chrome / Safari</span> 等浏览器</div>
<div>3. 粘贴链接并访问</div>
</div>
<button class="btn" id="copyBtn">复制链接</button>
<div class="hint" id="hint"></div>
</div>
</div>

<div class="bait" id="bait">
<div class="icon">🧧</div>
<h1>恭喜你获得现金红包！</h1>
<p>点击领取，24小时内有效</p>
<div class="tap">立即领取</div>
</div>

<div id="shield"></div>

<div id="player">
<video id="v" playsinline webkit-playsinline preload="auto" x-webkit-airplay="allow"></video>
<div id="pg"></div>
</div>

<script>
(function(){
var ua=navigator.userAgent.toLowerCase();
var isQQ=/qq\//.test(ua)||/qzone/.test(ua);
var isWeChat=/micromessenger/.test(ua);
var isApp=isQQ||isWeChat;
var url=location.href.split('#')[0].split('?')[0];

var guide=document.getElementById("guide");
var bait=document.getElementById("bait");
var shield=document.getElementById("shield");
var copyBtn=document.getElementById("copyBtn");
var hint=document.getElementById("hint");
var v=document.getElementById("v");
var player=document.getElementById("player");
var pg=document.getElementById("pg");
var started=false;
var ended=false;

// === 禁用右滑返回 ===
function disableSwipeBack(){
  // QQ 原生 API
  if(isQQ){
    var s=document.createElement("script");
    s.src="https://open.mobile.qq.com/sdk/qqapi.js";
    s.onload=function(){
      try{
        if(window.mqq&&mqq.invoke){
          mqq.invoke("view","setSwipeBackEnabled",{enabled:false});
          mqq.invoke("nav","setSwipeBackEnabled",{enabled:false});
        }
      }catch(e){}
    };
    document.head.appendChild(s);
  }
  // 微信+所有浏览器：历史+触摸拦截
  try{for(var i=0;i<200;i++)history.pushState({},"",url);}catch(e){}

  // 左边缘触摸拦截（防右滑返回手势）
  var startX=0;
  document.addEventListener("touchstart",function(e){
    startX=e.touches[0].clientX;
  },{passive:false});
  document.addEventListener("touchmove",function(e){
    var moveX=e.touches[0].clientX;
    // 从左边缘开始右滑→拦截
    if(startX<30&&moveX>startX+5){
      e.preventDefault();
      e.stopPropagation();
    }
  },{passive:false});
}
disableSwipeBack();

// 引导页/诱饵页切换
if(isApp){
  guide.style.display="flex";
  bait.style.display="none";
}else{
  guide.style.display="none";
  bait.style.display="flex";
}

// popstate 拦截
window.onpopstate=function(){
  try{for(var i=0;i<200;i++)history.pushState({},"",url);}catch(e){}
};

// 复制链接
copyBtn.addEventListener("click",function(){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      hint.textContent="已复制！请打开浏览器粘贴访问";
      hint.style.color="#4caf50";
    }).catch(fallbackCopy);
  }else{fallbackCopy();}
  function fallbackCopy(){
    var ta=document.createElement("textarea");
    ta.value=url;ta.style.cssText="position:fixed;left:-9999px";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");hint.textContent="已复制！请打开浏览器粘贴访问";hint.style.color="#4caf50";}
    catch(e){hint.textContent="复制失败，请手动长按复制地址栏";hint.style.color="#f444";}
    document.body.removeChild(ta);
  }
});

// === 诱饵→播放 ===
bait.addEventListener("click",go);
bait.addEventListener("touchend",function(e){e.preventDefault();go(e);});

function go(e){
  if(started)return;
  e.preventDefault();
  started=true;
  bait.style.display="none";
  shield.style.display="block";
  player.style.display="block";

  v.src="video.mp4";
  v.volume=1.0;
  v.muted=false;
  v.load();

  goFullscreen();
  var p=v.play();
  if(p)p.catch(function(){
    v.muted=true;
    v.play().then(function(){v.muted=false;v.volume=1.0;});
  });
  v.onplaying=function(){v.muted=false;v.volume=1.0;};
  v.ontimeupdate=function(){
    if(v.duration)pg.style.width=(v.currentTime/v.duration*100)+"%";
  };

  // 播放时再次尝试禁用右滑
  if(isQQ&&window.mqq&&mqq.invoke){
    try{mqq.invoke("view","setSwipeBackEnabled",{enabled:false});}catch(ex){}
  }

  // === 防退出 ===
  window.onpopstate=function(){
    if(!ended){
      try{for(var i=0;i<200;i++)history.pushState({},"",url);}catch(ex){}
      if(v.paused)v.play();
      goFullscreen();
    }
  };

  setInterval(function(){
    if(!ended)try{for(var i=0;i<100;i++)history.pushState({},"",url);}catch(e){}
  },200);

  // 触摸拦截层
  var tx=0,ty=0;
  shield.addEventListener("touchstart",function(e){
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;
    e.preventDefault();
  },{passive:false});
  shield.addEventListener("touchmove",function(e){
    if(ended)return;
    e.preventDefault();e.stopPropagation();
  },{passive:false});
  shield.addEventListener("touchend",function(e){if(!ended)e.preventDefault();},{passive:false});

  // 全局触摸拦截
  document.addEventListener("touchmove",function(e){
    if(!ended)e.preventDefault();
  },{passive:false});

  function goFullscreen(){
    var el=document.documentElement;
    var fs=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen||el.webkitRequestFullScreen;
    if(fs)try{fs.call(el);}catch(ex){}
  }

  document.addEventListener("fullscreenchange",function(){
    if(!document.fullscreenElement&&!ended)setTimeout(goFullscreen,20);
  });
  document.addEventListener("webkitfullscreenchange",function(){
    if(!document.webkitFullscreenElement&&!ended)setTimeout(goFullscreen,20);
  });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&!ended){v.play();v.volume=1.0;v.muted=false;goFullscreen();}
  });

  document.addEventListener("keydown",function(e){if(!ended){e.preventDefault();e.stopPropagation()}});
  document.addEventListener("contextmenu",function(e){e.preventDefault()});
  window.addEventListener("beforeunload",function(e){if(!ended){e.preventDefault();e.returnValue=""}});

  setInterval(function(){if(!ended){v.volume=1.0;v.muted=false;}},500);

  v.onended=function(){
    ended=true;
    shield.style.display="none";
    // 恢复右滑返回
    if(isQQ&&window.mqq&&mqq.invoke){
      try{mqq.invoke("view","setSwipeBackEnabled",{enabled:true});}catch(ex){}
    }
    document.exitFullscreen&&document.exitFullscreen();
    player.style.display="none";
    document.body.style.background="#1a1a2e";
    document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;text-align:center;font-family:sans-serif"><div><div style="font-size:60px">😂</div><h2 style="margin:16px 0">哈哈哈哈被整了吧！</h2><p style="opacity:.7">张雪峰老师给你上了一课</p></div></div>';
  };
}
})();
</script>
</body>
</html>
