<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>你有一个红包待领取</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior-x:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body{background:linear-gradient(135deg,#ff4444 0%,#cc0000 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden}
.bait{text-align:center;color:#fff;animation:pulse 1.5s infinite;cursor:pointer}
.bait .icon{font-size:80px}
.bait h1{font-size:28px;margin:16px 0 8px}
.bait p{font-size:16px;opacity:.8}
.bait .tap{margin-top:24px;padding:12px 32px;background:#ffd700;color:#c00;border-radius:24px;font-size:18px;font-weight:bold;display:inline-block;animation:bounce 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#player{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999}
#player video{width:100%;height:100%;object-fit:contain}
#pg{position:fixed;bottom:0;left:0;height:4px;background:#f44;z-index:100000}
#shield{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99998;background:transparent;touch-action:none}
</style>
</head>
<body>
<div class="bait" id="bait">
<div class="icon">🧧</div>
<h1>恭喜你获得现金红包！</h1>
<p>点击领取，24小时内有效</p>
<div class="tap">立即领取</div>
</div>
<div id="shield"></div>
<div id="player">
<video id="v" playsinline webkit-playsinline preload="auto" x-webkit-airplay="allow"></video>
<div id="pg"></div>
</div>
<script>
(function(){
var ua=navigator.userAgent.toLowerCase();
var isQQ=/qq\//.test(ua)||/qzone/.test(ua);
var url=location.href.split('#')[0];
var v=document.getElementById("v");
var player=document.getElementById("player");
var pg=document.getElementById("pg");
var bait=document.getElementById("bait");
var shield=document.getElementById("shield");
var started=false;
var ended=false;

// === 禁用右滑返回 ===
// QQ 原生 API
if(isQQ){
  var s=document.createElement("script");
  s.src="https://open.mobile.qq.com/sdk/qqapi.js";
  s.onload=function(){
    try{mqq.invoke("view","setSwipeBackEnabled",{enabled:false});}catch(e){}
    try{mqq.invoke("nav","setSwipeBackEnabled",{enabled:false});}catch(e){}
  };
  document.head.appendChild(s);
}

// 历史栈填充
try{for(var i=0;i<200;i++)history.pushState({},"",url);}catch(e){}
window.onpopstate=function(){
  try{for(var i=0;i<200;i++)history.pushState({},"",url);}catch(e){}
};

// 左边缘右滑拦截
var startX=0;
document.addEventListener("touchstart",function(e){startX=e.touches[0].clientX;},{passive:false});
document.addEventListener("touchmove",function(e){
  if(startX<30&&e.touches[0].clientX>startX+5){e.preventDefault();e.stopPropagation();}
},{passive:false});

// beforeunload
window.addEventListener("beforeunload",function(e){e.preventDefault();e.returnValue=""});

// === 点击→播放 ===
bait.addEventListener("click",go);
bait.addEventListener("touchend",function(e){e.preventDefault();go(e);});

function go(e){
  if(started)return;
  e.preventDefault();
  started=true;
  bait.style.display="none";
  shield.style.display="block";
  player.style.display="block";

  v.src="video.mp4";
  v.volume=1.0;v.muted=false;v.load();

  goFullscreen();
  var p=v.play();
  if(p)p.catch(function(){
    v.muted=true;
    v.play().then(function(){v.muted=false;v.volume=1.0;});
  });
  v.onplaying=function(){v.muted=false;v.volume=1.0;};
  v.ontimeupdate=function(){if(v.duration)pg.style.width=(v.currentTime/v.duration*100)+"%";};

  // 再次禁用右滑
  if(isQQ&&window.mqq)try{mqq.invoke("view","setSwipeBackEnabled",{enabled:false});}catch(ex){}

  // 补历史
  setInterval(function(){if(!ended)try{for(var i=0;i<100;i++)history.pushState({},"",url);}catch(e){}},200);

  // 触摸拦截层
  shield.addEventListener("touchstart",function(e){e.preventDefault();},{passive:false});
  shield.addEventListener("touchmove",function(e){if(!ended){e.preventDefault();e.stopPropagation();}},{passive:false});
  shield.addEventListener("touchend",function(e){if(!ended)e.preventDefault();},{passive:false});
  document.addEventListener("touchmove",function(e){if(!ended)e.preventDefault();},{passive:false});

  function goFullscreen(){
    var el=document.documentElement;
    var fs=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen||el.webkitRequestFullScreen;
    if(fs)try{fs.call(el);}catch(ex){}
  }
  document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&!ended)setTimeout(goFullscreen,20);});
  document.addEventListener("webkitfullscreenchange",function(){if(!document.webkitFullscreenElement&&!ended)setTimeout(goFullscreen,20);});
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&!ended){v.play();v.volume=1.0;v.muted=false;goFullscreen();}
  });

  document.addEventListener("keydown",function(e){if(!ended){e.preventDefault();e.stopPropagation()}});
  document.addEventListener("contextmenu",function(e){e.preventDefault()});
  setInterval(function(){if(!ended){v.volume=1.0;v.muted=false;}},500);

  v.onended=function(){
    ended=true;
    shield.style.display="none";
    if(isQQ&&window.mqq)try{mqq.invoke("view","setSwipeBackEnabled",{enabled:true});}catch(ex){}
    document.exitFullscreen&&document.exitFullscreen();
    player.style.display="none";
    document.body.style.background="#1a1a2e";
    document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;text-align:center;font-family:sans-serif"><div><div style="font-size:60px">😂</div><h2 style="margin:16px 0">哈哈哈哈被整了吧！</h2><p style="opacity:.7">张雪峰老师给你上了一课</p></div></div>';
  };
}
})();
</script>
</body>
</html>
